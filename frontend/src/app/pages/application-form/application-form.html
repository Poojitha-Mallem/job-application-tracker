<div class="form-page">
    <div class="form-card">
        <h1>{{ isEditMode() ? 'Edit Application' : 'New Application' }}</h1>

        @if (errorMessage()) {
            <div class="error-banner">{{ errorMessage() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-row">
                <div class="form-group">
                    <label for="companyName">Company Name *</label>
                    <input id="companyName" type="text" formControlName="companyName" />
                </div>
                <div class="form-group">
                    <label for="jobTitle">Job Title *</label>
                    <input id="jobTitle" type="text" formControlName="jobTitle" />
                </div>
            </div>

            <div class="form-group">
                <label for="jobDescription">Job Description</label>
                <textarea id="jobDescription" formControlName="jobDescription" rows="4"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" formControlName="status">
                        @for (status of statuses; track status) {
                            <option [value]="status">{{ status }}</option>
                        }
                    </select>
                </div>
                <div class="form-group">
                    <label for="appliedDate">Applied Date</label>
                    <input id="appliedDate" type="date" formControlName="appliedDate" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="source">Source</label>
                    <input id="source" type="text" formControlName="source" placeholder="LinkedIn, Referral, etc." />
                </div>
                <div class="form-group">
                    <label for="salaryExpectation">Salary Expectation</label>
                    <input id="salaryExpectation" type="number" formControlName="salaryExpectation" />
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn-primary" [disabled]="form.invalid || isLoading()">
                    {{ isLoading() ? 'Saving...' : 'Save' }}
                </button>
            </div>
        </form>
    </div>
</div>
